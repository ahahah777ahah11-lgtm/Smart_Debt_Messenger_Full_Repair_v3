name: Build Smart Debt Messenger APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Locate Android project and build APKs
        id: build
        shell: bash
        run: |
          if [[ -f app/build.gradle && -f settings.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            ARTIFACT_PREFIX=""
          elif [[ -f html-to-apk-builder/app/build.gradle && -f html-to-apk-builder/settings.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/html-to-apk-builder"
            ARTIFACT_PREFIX="html-to-apk-builder/"
          else
            echo 'Android Gradle project not found at repository root or html-to-apk-builder/.'
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=$ARTIFACT_PREFIX" >> "$GITHUB_OUTPUT"
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug assembleRelease
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Debt-Messenger-APK
          path: |
            ${{ steps.build.outputs.artifact_prefix }}app/build/outputs/apk/debug/*.apk
            ${{ steps.build.outputs.artifact_prefix }}app/build/outputs/apk/release/*.apk
          if-no-files-found: error
